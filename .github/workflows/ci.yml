name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  eslint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci || npm i
      - name: Run ESLint
        run: npx eslint -c eslint.config.mjs "src/apps-script/*.js" "src/apps-script/**/*.js" --max-warnings=0

  luacheck:
    name: Lint Lua Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Lua (luacheck)
        uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "5.4"
      - name: Setup LuaRocks
        uses: leafo/gh-actions-luarocks@v4
      - name: Install luacheck
        run: |
          luarocks install luacheck
      - name: Run luacheck
        run: |
          luacheck .


